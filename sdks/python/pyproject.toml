[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "at-utility-sdk"
version = "0.1.1"
description = "Drop-in OpenAI base_url helpers for Ohm (api.withohm.dev)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ohm", "openai", "llm", "cache"]
dependencies = []

[project.urls]
Homepage = "https://withohm.dev"
Documentation = "https://withohm.dev/docs"
Repository = "https://github.com/iwasinnam2/withohm-open"

[project.optional-dependencies]
openai = ["openai>=1.40.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["at_utility_sdk*"]
