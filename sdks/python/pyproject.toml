[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "at-utility-sdk"
version = "0.1.1"
description = "OpenAI base_url helper and receipt verifier for Metrecept: signed Ed25519 receipts for AI agent calls (api.metrecept.co.uk)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["metrecept", "openai", "llm", "receipts", "ed25519", "jws", "agents"]
dependencies = []

[project.urls]
Homepage = "https://metrecept.co.uk"
Documentation = "https://metrecept.co.uk/docs"
Repository = "https://github.com/iwasinnam2/metrecept-opensource"

[project.optional-dependencies]
openai = ["openai>=1.40.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["at_utility_sdk*"]
