# Neon + withOhm — PR preview tip
# Copy to your app as .github/workflows/ohm-preview.yml
#
# Secrets: OHM_API_KEY (required), OHM_UPSTREAM_KEY (optional BYOK)
# Vars:    OHM_API_URL (optional, default https://api.withohm.dev)
#
# Neon owns DATABASE_URL / branch lifecycle in your own steps.
# This job only ensures X-Ohm-Cache-Tree: pr-<N> exists and smokes it.

name: ohm-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive TREE_ID (same slug as Neon PR branch)
        id: tree
        run: |
          TREE_ID="pr-${{ github.event.pull_request.number }}"
          echo "tree_id=${TREE_ID}" >> "$GITHUB_OUTPUT"
          echo "X-Ohm-Cache-Tree=${TREE_ID}"

      - name: Fork Ohm tip from main (reuse if exists)
        env:
          OHM_API_KEY: ${{ secrets.OHM_API_KEY }}
          OHM_API_URL: ${{ vars.OHM_API_URL }}
          TREE_ID: ${{ steps.tree.outputs.tree_id }}
        run: |
          export OHM_API_URL="${OHM_API_URL:-https://api.withohm.dev}"
          export OHM_BASE_URL="${OHM_API_URL%/}/v1"
          SCRIPT=templates/neon-ohm-ci/scripts/ohm_tree.sh
          if [ -f "$SCRIPT" ]; then
            bash "$SCRIPT" fork "$TREE_ID" main
          else
            code=$(curl -sS -o /tmp/ohm_fork.json -w "%{http_code}" -X POST \
              "${OHM_BASE_URL}/cache/trees" \
              -H "Authorization: Bearer ${OHM_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${TREE_ID}\",\"parent\":\"main\"}")
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then
              echo "fork failed HTTP $code"; cat /tmp/ohm_fork.json; exit 1
            fi
            echo "fork ok / reuse (HTTP $code)"
          fi

      - name: Smoke chat on tip (optional — replace with your suite)
        env:
          OHM_API_KEY: ${{ secrets.OHM_API_KEY }}
          OHM_UPSTREAM_KEY: ${{ secrets.OHM_UPSTREAM_KEY }}
          OHM_API_URL: ${{ vars.OHM_API_URL }}
          TREE_ID: ${{ steps.tree.outputs.tree_id }}
        run: |
          export OHM_API_URL="${OHM_API_URL:-https://api.withohm.dev}"
          export OHM_BASE_URL="${OHM_API_URL%/}/v1"
          curl -sS "${OHM_BASE_URL}/chat/completions" \
            -H "Authorization: Bearer ${OHM_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "X-Ohm-Cache-Tree: ${TREE_ID}" \
            ${OHM_UPSTREAM_KEY:+-H "X-Ohm-Upstream-Key: ${OHM_UPSTREAM_KEY}"} \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"ohm-ci-self-proof-v1"}]}' \
            | head -c 2000
          echo

      # - name: App tests against Neon preview branch
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #     OHM_TIP: ${{ steps.tree.outputs.tree_id }}
      #   run: npm test
