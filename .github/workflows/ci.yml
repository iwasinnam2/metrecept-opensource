name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ./packages/metrecept-mcp
      - name: MCP stdio smoke test
        run: python .github/scripts/smoke_mcp.py metrecept-mcp
      - name: Compatibility command smoke test
        run: python .github/scripts/smoke_mcp.py ohm-mcp
