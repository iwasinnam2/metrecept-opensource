[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution is withohm-mcp ("ohm-mcp" on PyPI is an unrelated third-party
# project). The console script and import module remain ohm-mcp / ohm_mcp.
name = "withohm-mcp"
version = "0.2.3"
description = "Metrecept MCP server for Cursor — prompt cache replay + compliant public-web fetch over one OpenAI-compatible pipe"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://metrecept.co.uk"
Documentation = "https://metrecept.co.uk/docs/cursor"
Repository = "https://github.com/iwasinnam2/withohm-open"

[project.scripts]
ohm-mcp = "ohm_mcp:main"
ohm-mcp-http = "ohm_mcp:main_http"
metrecept-tap = "ohm_mcp.tap_client:main"

[tool.setuptools.packages.find]
where = ["src"]
