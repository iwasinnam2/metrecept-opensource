[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrecept-mcp"
version = "1.0.0"
description = "Metrecept MCP server for Cursor — exact-match replay + compliant public-web fetch over one OpenAI-compatible pipe"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://metrecept.co.uk"
Documentation = "https://metrecept.co.uk/docs/cursor"
Repository = "https://github.com/iwasinnam2/metrecept-opensource"

[project.scripts]
metrecept-mcp = "metrecept_mcp:main"
metrecept-mcp-http = "metrecept_mcp:main_http"

[tool.setuptools.packages.find]
where = ["src"]
