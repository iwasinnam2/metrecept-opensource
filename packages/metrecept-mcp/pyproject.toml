[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrecept-mcp"
version = "0.7.0"
description = "Metrecept MCP server: signed, independently verifiable Ed25519 receipts for autonomous AI agent calls (chat, web fetch, third-party APIs). Thin client; hosted gateway needs an API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://metrecept.co.uk"
Documentation = "https://metrecept.co.uk/docs/cursor"
Repository = "https://github.com/iwasinnam2/metrecept-opensource"

[project.scripts]
metrecept-mcp = "metrecept_mcp:main"
metrecept-mcp-http = "metrecept_mcp:main_http"

[tool.setuptools.packages.find]
where = ["src"]
include = ["metrecept_mcp*"]
